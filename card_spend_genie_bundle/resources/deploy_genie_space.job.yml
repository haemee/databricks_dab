resources:
  jobs:
    deploy_genie_space:
      name: deploy_card_spend_genie_space
      description: src/genie_space.json 구성으로 카드 소비 분석 Genie 에이전트를 생성하거나 업데이트합니다.
      max_concurrent_runs: 1
      tasks:
        - task_key: deploy_genie_space
          notebook_task:
            notebook_path: ../src/deploy_genie_space.ipynb
            base_parameters:
              config_path: ${workspace.file_path}/src/genie_space.json
              warehouse_id: ${var.warehouse_id}
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              catalog: ${var.catalog}
              schema: ${var.schema}
              space_title: ${var.space_title}
              space_id: ${var.space_id}
              parent_path: ${var.parent_path}
